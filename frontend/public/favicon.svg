<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="cv-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="cv-c-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <linearGradient id="cv-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <filter id="cv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space rounded icon background -->
  <rect width="64" height="64" rx="16" fill="url(#cv-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Cosmic Universe Orbit Ring -->
  <ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(-28 32 32)" stroke="url(#cv-orbit)" stroke-width="1.6" stroke-dasharray="65 12 25 8" opacity="0.85" />

  <!-- Primary Cinema 'C' Arc -->
  <path d="M 46 16.5 C 39 10.5 28 10.5 19.5 17 C 9.5 24.5 9.5 39.5 19.5 47 C 28 53.5 39 53.5 46 47.5" stroke="url(#cv-c-arc)" stroke-width="5" stroke-linecap="round" filter="url(#cv-glow)" />

  <!-- Streaming Play Prism -->
  <path d="M 28.5 23.5 L 43.5 32 L 28.5 40.5 Z" fill="url(#cv-prism)" stroke="url(#cv-prism)" stroke-width="1.8" stroke-linejoin="round" filter="url(#cv-glow)" />

  <!-- Celestial Aperture Flare Star -->
  <circle cx="46" cy="16.5" r="1.8" fill="#ffffff" />
  <circle cx="43.5" cy="32" r="1.2" fill="#ffffff" />
</svg>
